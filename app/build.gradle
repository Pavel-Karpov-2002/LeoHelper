plugins {
    id 'com.android.application' version '8.7.3'
    id 'com.chaquo.python' version '17.2.0'
}

android {
    namespace 'org.leohelper.android'
    compileSdk 35

    defaultConfig {
        applicationId 'org.leohelper.android'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.5'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        if (System.getenv('LEO_BUILD_PYTHON')) {
            buildPython System.getenv('LEO_BUILD_PYTHON')
        }
        pip {
            options '--find-links', file('wheels').absolutePath
            install 'Telethon==1.45.0'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}





